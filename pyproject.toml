[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contract-lint"
version = "0.2.5"
description = "Lint a contract for internal-consistency defects — leftover placeholders, broken cross-references, undefined/unused defined terms, numbering gaps, party-name and date inconsistencies — with CI-gateable exit codes. Deterministic, stdlib-only. Also composes with the contract-ops suite."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "DrBaher", email = "Drbaher@gmail.com" }]
keywords = [
  "contract-ops",
  "agent-first",
  "cli",
  "legal-tech",
  "linter",
  "contracts",
  "legal",
  "ci",
  "sarif",
  "quality-gate",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Legal Industry",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Text Processing :: Linguistic",
  "Topic :: Utilities",
  "Typing :: Typed",
]
# Zero runtime dependencies. The core (.md/.txt/.html, all eight rules, --json/--sarif)
# is fully functional with nothing installed.
dependencies = []

[project.optional-dependencies]
# .pdf reading is delegated to extract-cli's document backend; the extra pulls it in.
# The core works WITHOUT any extra (.md/.txt/.html/.docx, or text piped on stdin).
# `[docx]` is kept for compatibility and as a fallback reader only: python-docx cannot
# see Word's automatic list numbering, so the stdlib reader is the preferred .docx path.
docx = ["extract-cli[docx]"]
pdf = ["extract-cli[pdf]"]
# Reserved for a future opt-in LLM rule (off by default, never on a hot path); uses the
# shared ~/.config/contract-ops/llm.json. No runtime dep today.
llm = []
dev = [
  "pytest>=7.0",
  "coverage>=7.0",
  "mypy>=1.5",
  "build>=1.0",
]

[project.scripts]
contract-lint = "contract_lint_cli:main"

[project.urls]
Homepage = "https://cli.drbaher.com"
Repository = "https://github.com/DrBaher/contract-lint-cli"
Suite = "https://github.com/DrBaher"
Changelog = "https://github.com/DrBaher/contract-lint-cli/blob/main/CHANGELOG.md"

# Single-module project: ship contract_lint_cli.py explicitly (the module name does not
# match the normalized distribution name, so hatchling cannot auto-detect it).
[tool.hatch.build.targets.wheel]
include = ["contract_lint_cli.py"]

[tool.hatch.build.targets.sdist]
include = [
  "contract_lint_cli.py",
  "README.md",
  "AGENTS.md",
  "llms.txt",
  "LICENSE",
  "CHANGELOG.md",
  "ARCHITECTURE.md",
  "CONTRIBUTING.md",
  "Makefile",
  "pyproject.toml",
  "docs/**",
  "config/**",
  "tests/**",
  "scripts/**",
]

[tool.mypy]
# No python_version pin: mypy targets the running interpreter, so the CI matrix (3.9-3.12)
# type-checks every supported version. requires-python stays >=3.9.
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.coverage.run]
source = ["contract_lint_cli"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
