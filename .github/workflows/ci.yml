name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }} · py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        # Windows on the newest Python only (keeps Windows minutes down while proving portability).
        exclude:
          - { os: windows-latest, python-version: "3.9" }
          - { os: windows-latest, python-version: "3.10" }
          - { os: windows-latest, python-version: "3.11" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (editable + dev extras)
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Locale-safe / ASCII output check (UTF-8 disabled)
        if: runner.os != 'Windows'
        run: |
          LC_ALL=C LANG=C python contract_lint_cli.py demo > /dev/null
          LC_ALL=C LANG=C python contract_lint_cli.py demo --json > /dev/null
          LC_ALL=C LANG=C python contract_lint_cli.py --version

  typecheck:
    name: mypy --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m mypy --strict contract_lint_cli.py

  spec-check:
    name: schema conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Validate --json / SARIF / rules output against docs/spec (offline)
        run: python -m pytest tests/test_schema_conformance.py -q

  build-smoke:
    name: build + wheel smoke install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - name: Build wheel + sdist
        run: python -m build
      - name: Smoke-install the wheel in a clean venv and run it
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install --upgrade pip
          /tmp/smoke/bin/python -m pip install dist/*.whl
          /tmp/smoke/bin/contract-lint --version
          /tmp/smoke/bin/contract-lint demo > /dev/null
          /tmp/smoke/bin/contract-lint --catalog json > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
